info:
  contact: {}
paths:
  /api/ping:
    get:
      consumes:
      - application/json
      description: Returns a simple "pong" response to test server availability.
      produces:
      - application/json
      responses:
        "200":
          description: pong
          schema:
            type: string
      summary: Ping the server
      tags:
      - Health
  /results/delete:
    post:
      consumes:
      - application/json
      description: Deletes a result, by id, and all of its associated data from the
        database.
      parameters:
      - description: The result ID to delete
        in: body
        name: query
        required: true
        schema:
          $ref: '#/definitions/api.deleteResultRequest'
      produces:
      - application/json
      responses:
        "200":
          description: ok
          schema:
            type: string
      summary: Delete a result
      tags:
      - Results
  /results/detail/{id}:
    get:
      consumes:
      - application/json
      description: Get details for a result.
      parameters:
      - description: The screenshot ID to load.
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Result'
      summary: Results detail
      tags:
      - Results
  /results/gallery:
    get:
      consumes:
      - application/json
      description: Get a paginated list of results.
      parameters:
      - description: The page to load.
        in: query
        name: page
        type: integer
      - description: Number of results per page.
        in: query
        name: limit
        type: integer
      - description: A comma seperated list of technologies to filter by.
        in: query
        name: technologies
        type: string
      - description: A comma seperated list of HTTP status codes to filter by.
        in: query
        name: status
        type: string
      - description: Order the results by perception hash.
        in: query
        name: perception
        type: boolean
      - description: Include failed screenshots in the results.
        in: query
        name: failed
        type: boolean
      - description: A comma separated list of url schemes (http, https, vnc, rdp)
          to filter by.
        in: query
        name: schemes
        type: string
      - description: A comma separated list of tags to filter by (matches any).
        in: query
        name: tags
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.galleryResponse'
      summary: Gallery
      tags:
      - Results
  /results/list:
    get:
      consumes:
      - application/json
      description: Get a simple list of all results.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.listResponse'
      summary: Results list
      tags:
      - Results
  /results/tag:
    get:
      consumes:
      - application/json
      description: Get all the unique tags detected by the favicon-hash + YAML tagger,
        with their classification axis.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.tagListResponse'
      summary: Get tag results
      tags:
      - Results
  /results/technology:
    get:
      consumes:
      - application/json
      description: Get all the unique technology detected.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.technologyListResponse'
      summary: Get technology results
      tags:
      - Results
  /search:
    post:
      consumes:
      - application/json
      description: Searches for results based on free form text, or operators.
      parameters:
      - description: 'The search term to search for. Supports search operators: `title:`,
          `tech:`, `header:`, `body:`, `p:`'
        in: body
        name: query
        required: true
        schema:
          $ref: '#/definitions/api.searchRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.searchResult'
      summary: Search for results
      tags:
      - Results
  /statistics:
    get:
      consumes:
      - application/json
      description: Get database statistics.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.statisticsResponse'
      summary: Database statistics
      tags:
      - Results
  /submit:
    post:
      consumes:
      - application/json
      description: Starts a new scanning routine for a list of URL's and options,
        writing results to the database.
      parameters:
      - description: The URL scanning request object
        in: body
        name: query
        required: true
        schema:
          $ref: '#/definitions/api.submitRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Probing started
          schema:
            type: string
      summary: Submit URL's for scanning
      tags:
      - Results
  /submit/single:
    post:
      consumes:
      - application/json
      description: Starts a new probing routine for a URL and options, returning the
        results when done.
      parameters:
      - description: The URL scanning request object
        in: body
        name: query
        required: true
        schema:
          $ref: '#/definitions/api.submitSingleRequest'
      produces:
      - application/json
      responses:
        "200":
          description: The URL Result object
          schema:
            $ref: '#/definitions/models.Result'
      summary: Submit a single URL for probing
      tags:
      - Results
  /wappalyzer:
    get:
      consumes:
      - application/json
      description: Get all of the available wappalyzer data.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get wappalyzer data
      tags:
      - Results
swagger: "2.0"
